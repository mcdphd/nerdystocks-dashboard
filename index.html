function sidebar(){const groups=DATA.groups; const by={}; DATA.stocks.forEach(s=>{(by[s.group]??=[]).push(s)}); let html='<div class=\"brand\"><span class=\"icon\">📈</span><span class=\"brand-name\">NerdyStocks</span><span class=\"version\">'+DATA.metrics.version+'</span></div><div class="subtitle">Portfolio Command Center</div><div class="decision-mini"><h3>✨ Decision Center</h3><div>Your top 3 priorities for '+DATA.metrics.ladder_for+'</div><button style="margin-top:10px;background:#09294b;border:1px solid #2362a2;color:#80c7ff;border-radius:7px;padding:8px 10px">View All Opportunities</button></div><h3>Portfolio Hierarchy</h3><div class="search"><input placeholder="Search symbols..." oninput="filterStocks(this.value)"></div>';
 Object.keys(groups).forEach(g=>{const meta=groups[g]; const arr=by[g]||[]; html+=`<div class="group g-${meta.color}"><div class="group-head"><div>${meta.num} ${g}<small>Target: ${meta.target} · ${arr.length} Holdings</small></div><div>⌄</div></div>`; arr.forEach(s=>{html+=`<div class="stock-nav" data-symbol="${s.symbol}" onclick="selectStock('${s.symbol}')"><div><div class="sym">${s.symbol}</div><div class="company-small">${s.company}</div></div><span class="pill">${Math.round(s.leadership)}</span><span class="trend ${trendClass(s.trend)}">${s.trend}</span></div>`}); html+='</div>'});
 html+=`<div class="box"><small>Data as of: ${DATA.metrics.data_as_of}</small><br><small>Next Ladder: <b>${DATA.metrics.ladder_for}</b></small></div>`; document.getElementById('sidebar').innerHTML=html;}
function decision(){const buy=DATA.stocks.find(s=>s.symbol==='ASML'); const sell=DATA.stocks.find(s=>s.symbol==='NVDA'); const watch=DATA.stocks.find(s=>s.symbol==='AMZN'); document.getElementById('decision').innerHTML=`<div class="decision-title"><div><b>Decision Center</b> <span style="color:var(--muted);margin-left:12px">Today's top priorities</span></div><a style="color:#58b5ff">View All Signals →</a></div><div class="decision-grid">

 <div class="dec-card sell"><h3>🎯 Sell Today <span class="scorebig">92/100</span></h3><div class="dec-symbol">${sell.symbol}</div><div>${sell.company}</div><p>Why: over 50% of portfolio, in harvest mode, reduce concentration.</p></div>
 <div class="dec-card watch"><h3>👁 Watch Closely <span class="scorebig">72/100</span></h3><div class="dec-symbol">${watch.symbol}</div><div>${watch.company}</div><p>Why: weak momentum; could continue toward full rotation exit.</p></div>
 </div>`;}
function ladderRows(levels,type){return levels.map(x=>`<tr><td><span class="levelbox">${x.level}</span></td><td><div class="price">${fmtMoney(x.price)}</div><div class="limit">Limit ${type==='buy'?'Buy':'Sell'}</div></td><td>${type==='buy'?fmtMoney(x.allocation):fmtPct(x.shares?33:0)}</td><td>${fmtSh(x.shares)}</td><td>${type==='buy'?'Waiting':fmtMoney(x.proceeds)}</td><td>${x.note||''}</td></tr>`).join('') || '<tr><td colspan="6">No ladder for this side.</td></tr>'}
function selectStock(sym){const s=DATA.stocks.find(x=>x.symbol===sym)||DATA.stocks[0]; document.querySelectorAll('.stock-nav').forEach(el=>el.classList.toggle('active',el.dataset.symbol===sym)); const pl=s.total_pl||0; document.getElementById('detail').innerHTML=`

 <div class="tabs"><div class="tab active">Overview</div><div class="tab">Ladders</div><div class="tab">Analysis</div><div class="tab">Notes</div><div class="tab">Performance</div></div>
 <div class="content"><div class="ladder buy"><h3>Buy Ladder (${s.status}) <span style="float:right;color:var(--muted);font-size:13px">Budget: ${fmtMoney(s.buy.reduce((a,b)=>a+b.allocation,0))}</span></h3><table><thead><tr><th>Level</th><th>Price</th><th>Allocation</th><th>Shares</th><th>Status</th><th>Notes</th></tr></thead><tbody>${ladderRows(s.buy,'buy')}</tbody></table></div><div class="ladder sell"><h3>Sell Ladder / Review <span style="float:right;color:var(--muted);font-size:13px">Target: ${fmtMoney(s.sell.reduce((a,b)=>a+b.proceeds,0))}</span></h3><table><thead><tr><th>Level</th><th>Price</th><th>Trim</th><th>Shares</th><th>Proceeds</th><th>Notes</th></tr></thead><tbody>${ladderRows(s.sell,'sell')}</tbody></table></div><div class="side-panel"><div class="box"><h3>Leadership Profile</h3>${['Relative Strength','Earnings Power','Price Structure','Market Leadership','Overall Score'].map((n,i)=>`<div class="profile-row"><span>${n}</span><div class="meter"><span style="width:${Math.max(10,Math.min(100,s.leadership-(i*2)))}%"></span></div><b>${Math.max(0,Math.round(s.leadership-(i*2)))}</b></div>`).join('')}</div><div class="box"><h3>Key Levels</h3><div>Current: <b style="float:right">${fmtMoney(s.price)}</b></div><div>Avg Cost: <b style="float:right">${fmtMoney(s.avg_cost)}</b></div><div>Shares: <b style="float:right">${fmtSh(s.quantity)}</b></div><div>Weight: <b style="float:right">${fmtPct(s.weight)}</b></div></div></div></div>
 <div class="lower"><div class="box"><h3>Technical Snapshot</h3><div>Price (AH) <b style="float:right">${fmtMoney(s.price)}</b></div><div>Trend <b class="trend ${trendClass(s.trend)}" style="float:right">${s.trend}</b></div><div>Leadership <b style="float:right">${Math.round(s.leadership)}</b></div></div><div class="box"><h3>Portfolio Health</h3><div class="health-score positive">91<small>/100</small></div><div class="positive">Excellent</div><div class="health-bars"><div class="health-line"><span>Leadership</span><div class="health-meter"><span style="width:95%"></span></div><b>95</b></div><div class="health-line"><span>Diversification</span><div class="health-meter"><span style="width:84%"></span></div><b>84</b></div><div class="health-line"><span>Risk Mgmt</span><div class="health-meter"><span style="width:92%"></span></div><b>92</b></div><div class="health-line"><span>Cash Efficiency</span><div class="health-meter"><span style="width:78%"></span></div><b>78</b></div><div class="health-line"><span>Momentum</span><div class="health-meter"><span style="width:97%"></span></div><b>97</b></div></div><div class="callout"><b>Biggest Weakness</b><span class="warning-text">NVDA concentration remains high; harvest plan stays active.</span></div></div><div class="box"><h3>Capital Allocation Engine</h3><div>Deployable cash: <b>${fmtMoney(DATA.metrics.deployable)}</b></div><div class="progress"><div class="bar" style="width:86%"></div></div><small>Cash efficiency: Good</small></div><div class="box"><h3>Allocation & Risk</h3><div style="font-size:34px;font-weight:900">${fmtPct(s.weight)}</div><div>Risk Status: <b class="positive">${s.weight>40?'Watch':'Good'}</b></div></div></div>`;}
function footer(){const ranks=['ASML','CRWD','AMD','ANET','SPCX']; document.getElementById('footergrid').innerHTML=`<div class="small-card"><h3>Portfolio Health</h3><div style="font-size:32px;font-weight:900">94<small>/100</small></div><div class="positive">Excellent</div></div><div class="small-card"><h3>Opportunity Ranking</h3>${ranks.map((r,i)=>`<div class="rank-row"><b>${i+1}</b><span>${r}</span><span class="positive">${98-i*3}</span></div>`).join('')}</div><div class="small-card"><h3>Replacement Queue</h3>${['ASML','CRWD','AMD','ARM'].map((r,i)=>`<div class="rank-row"><b>${i+1}</b><span>${r}</span><span>${i<3?'Incubator':'Watch'}</span></div>`).join('')}</div><div class="small-card"><h3>AI Commentary</h3><p>ASML remains the highest-priority incubator. NVDA remains the highest-priority harvest because it exceeds 50% of the portfolio while leadership remains weak.</p></div><div class="small-card"><h3>Portfolio Evolution</h3><p>TSM/PANW are core. ASML/CRWD/AMD are now seeded. AMZN/NVDA are being harvested by the rotation engine.</p></div>`;}
function filterStocks(q){q=(q||'').toUpperCase(); document.querySelectorAll('.stock-nav').forEach(el=>{el.style.display=el.dataset.symbol.includes(q)?'grid':'none'})}
kpi(); sidebar(); decision(); footer(); selectStock('TSM');
